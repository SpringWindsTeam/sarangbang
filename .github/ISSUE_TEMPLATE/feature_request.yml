name: 기능 제안 (Feature Request)
description: 새 어댑터, CLI 기능, 엔진 개선 제안
title: "[feat] "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: 어떤 상황에서 불편한가요?
      description: 지금은 어떻게 하고 있고, 무엇이 안 되는지
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 제안
      description: 원하는 동작, 가능하면 API·명령어 예시
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: 영역
      multiple: true
      options:
        - 엔진 (Room · run_rooms · 발언 순위)
        - 프롬프트 사양 · 주제(Topic) · 플러그인
        - 페르소나 어댑터 · 데이터셋
        - 모델 제공처 · CLI
        - 문서
  - type: textarea
    id: alternatives
    attributes:
      label: 생각해 본 다른 방법
