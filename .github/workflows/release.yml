# 태그 v<버전>을 올리면: 빌드 → GitHub Release(휠·sdist 첨부) → PyPI(Trusted Publishing).
# PyPI 단계는 저장소 변수 PYPI_PUBLISH=true 일 때만 돈다(PyPI 쪽 Trusted Publisher 등록 전에는 건너뜀). 절차: docs/release.md
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build:
    name: Build distributions
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Verify tag matches package version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python - <<'PY'
          import os, re
          from pathlib import Path
          v = re.search(r'__version__\s*=\s*"([^"]+)"', Path("src/sarangbang/__init__.py").read_text("utf-8")).group(1)
          tag = os.environ["RELEASE_TAG"]
          if tag != f"v{v}":
              raise SystemExit(f"tag {tag} does not match __version__ v{v}")
          print("version", v)
          PY
      - name: Build
        run: |
          python -m pip install "build>=1.2" "twine>=5"
          python -m build
          python -m twine check dist/*
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/*
          if-no-files-found: error

  github-release:
    name: GitHub Release
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist
      - name: Extract release notes from CHANGELOG
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python - <<'PY'
          import os, re
          from pathlib import Path
          v = os.environ["RELEASE_TAG"].lstrip("v")
          text = Path("CHANGELOG.md").read_text("utf-8")
          m = re.search(rf"^## {re.escape(v)}.*?$(.*?)(?=^## |\Z)", text, re.S | re.M)
          notes = (m.group(1).strip() if m else "") or f"sarangbang {v}"
          notes += "\n\n```bash\npip install sarangbang==" + v + "\n```"
          Path("RELEASE_NOTES.md").write_text(notes, "utf-8")
          PY
      - uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          files: dist/*
          body_path: RELEASE_NOTES.md
          generate_release_notes: false

  pypi:
    name: Publish to PyPI (trusted publishing)
    needs: build
    if: vars.PYPI_PUBLISH == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: pypi
      url: https://pypi.org/p/sarangbang
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
